# Cloudflare now builds this repo itself through its dashboard git
# integration, so this no longer runs on push — it would only duplicate
# that deploy, and fails red without a token. Kept as a manual fallback:
# run it from the Actions tab if the dashboard integration ever breaks.
# Needs a CLOUDFLARE_API_TOKEN repository secret to work.
name: Deploy to Cloudflare (manual fallback)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the deploy token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set."
            echo "Create a token with the 'Edit Cloudflare Workers' template at"
            echo "https://dash.cloudflare.com/profile/api-tokens then add it at"
            echo "Settings > Secrets and variables > Actions."
            exit 1
          fi

      # only the files that ship; the repo also holds the source .mov masters
      - name: Assemble dist
        run: ./build-dist.sh

      # installed explicitly: the wrangler-action's npx shim cannot install
      # non-interactively and silently falls back to a wrangler too old to
      # understand an assets-only Worker
      - name: Install wrangler
        run: npm install --no-save wrangler@4

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 883e64f560bf4d3befd3e507c18baaba
        run: npx wrangler deploy
