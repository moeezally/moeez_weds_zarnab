<script>
var NS="http://www.w3.org/2000/svg";
      function rng(seed) {
        var s = seed >>> 0;
        return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
      }
      function pick(r, arr) { return arr[Math.floor(r() * arr.length) % arr.length]; }

      var BLOOMS = [
        "--p1:#8c2a33;--p2:#6b1524;--p3:#48101c",
        "--p1:#8e2f3a;--p2:#6b1524;--p3:#48101c",
        "--p1:#e3cdb8;--p2:#cfb298;--p3:#a98468",
        "--p1:#f6e7db;--p2:#e8d0c0;--p3:#cfae9b",
        "--p1:#b87076;--p2:#954a54;--p3:#6b2a35"
      ];
      var GREENS = [
        "--lf:#7b8468;--lfv:#585f48",
        "--lf:#8a9275;--lfv:#656c52",
        "--lf:#69735a;--lfv:#4a5339",
        "--lf:#a0a98a;--lfv:#757e60"
      ];

      function use(id, x, y, size, rot, style) {
        var u = document.createElementNS(NS, "use");
        u.setAttribute("href", "#" + id);
        u.setAttribute("x", (x - size / 2).toFixed(2));
        u.setAttribute("y", (y - size / 2).toFixed(2));
        u.setAttribute("width", size.toFixed(2));
        u.setAttribute("height", size.toFixed(2));
        u.setAttribute("transform", "rotate(" + rot.toFixed(1) + " " + x.toFixed(2) + " " + y.toFixed(2) + ")");
        if (style) u.setAttribute("style", style);
        return u;
      }

      /* A cluster: leaves laid down first, blooms on top, a few buds between. */
      function cluster(host, cx, cy, spread, nBloom, minB, maxB, nLeaf, seed) {
        var r = rng(seed), g = document.createElementNS(NS, "g"), i, a, d;
        for (i = 0; i < nLeaf; i++) {
          a = r() * Math.PI * 2; d = spread * (0.35 + r() * 0.95);
          g.appendChild(use("leaf", cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.8,
            spread * (0.32 + r() * 0.3), r() * 360, pick(r, GREENS)));
        }
        for (i = 0; i < Math.round(nBloom * 0.5); i++) {
          a = r() * Math.PI * 2; d = spread * (0.4 + r() * 0.8);
          g.appendChild(use("bud", cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.8,

            minB + r() * (maxB - minB), r() * 360, pick(r, BLOOMS)));

  });

}
